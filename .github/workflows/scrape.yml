name: Scrape Green Fees

on:
  schedule:
    # Daily at midnight UTC = 9 AM KST
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        working-directory: scraper
        run: npm install

      - name: Run scraper
        working-directory: scraper
        env:
          MONTVERT_USER_ID: ${{ secrets.MONTVERT_USER_ID }}
          MONTVERT_PASSWORD: ${{ secrets.MONTVERT_PASSWORD }}
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: npm run scrape

      - name: Copy latest data to docs for GitHub Pages
        run: |
          mkdir -p docs/data/montvert
          cp data/index.json docs/data/index.json
          cp data/montvert/*.json docs/data/montvert/

      - name: Commit and push data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: daily green fee snapshot [skip ci]"
          file_pattern: "data/** docs/data/**"
