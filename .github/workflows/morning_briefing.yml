name: Morning Briefing Telegram Bot

on:
  schedule:
    # Daily at 7:00 AM KST = 22:00 UTC previous day
    - cron: '0 22 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab
    inputs:
      dry_run:
        description: 'Print the briefing in the log instead of sending it to Telegram'
        type: boolean
        default: false

# models:read lets the built-in GITHUB_TOKEN call GitHub Models (free tier)
permissions:
  contents: read
  models: read

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: projects/morning-briefing/package-lock.json

      - name: Install dependencies
        working-directory: projects/morning-briefing
        run: npm install

      - name: Run Morning Briefing Bot
        working-directory: projects/morning-briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          INDICES: '^GSPC,^IXIC,^DJI'
          EQUITIES: 'NVDA,AAPL,MSFT,TSLA,GOOGL,AMZN,NTAP'
          TIMEZONE: 'Asia/Seoul'
        run: npm start
