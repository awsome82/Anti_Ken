name: Morning Briefing Telegram Bot

on:
  schedule:
    # Daily at 7:00 AM KST = 22:00 UTC previous day
    - cron: '0 22 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: morning-briefing/package-lock.json

      - name: Install dependencies
        working-directory: morning-briefing
        run: npm install

      - name: Run Morning Briefing Bot
        working-directory: morning-briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INDICES: '^GSPC,^IXIC,^DJI'
          EQUITIES: 'NVDA,AAPL,MSFT,TSLA,GOOGL,AMZN'
          TIMEZONE: 'Asia/Seoul'
        run: npm start
