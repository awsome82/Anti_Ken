name: Deploy Dashboard

# Publishes docs/ (dashboard code, from main) together with the snapshots on
# the `data` branch to GitHub Pages.
# Requires Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_run:
    workflows: ['Scrape Green Fees']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble site (docs/ + data branch)
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          rm -rf _site/data
          mkdir -p _site/data
          if git fetch --depth=1 origin data; then
            git archive FETCH_HEAD | tar -x -C _site/data
          else
            echo "No data branch yet; using legacy data/ from main."
            cp -r data/. _site/data/
          fi
          echo "Snapshots: $(ls _site/data/montvert | wc -l)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
